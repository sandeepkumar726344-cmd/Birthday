<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Birthday Surprise for Jyant!</title>
    <!-- Premium Fonts Import -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. Global & Background Setup --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #0f0c29; 
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Fixed background canvas */
        canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 2. Start Button Screen --- */
        #start-screen {
            position: fixed;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }

        #start-btn {
            padding: 18px 45px;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.8);
        }
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
        }

        /* --- 3. Main UI Container --- */
        #ui-container {
            position: relative;
            z-index: 10;
            width: 100%;
            min-height: 100vh;
            display: none; /* Button click ke baad flex hoga */
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 100px 20px;
        }

        /* --- 4. Text Animations --- */
        #happy-birthday {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* Responsive font */
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            margin-top: 20px;
            text-shadow: 0 0 15px currentColor;
            animation: colorChange 4s infinite alternate;
        }
        @keyframes colorChange {
            0% { color: #ff3366; text-shadow: 0 0 20px #ff3366; } 
            33% { color: #00e5ff; text-shadow: 0 0 20px #00e5ff; } 
            66% { color: #ffea00; text-shadow: 0 0 20px #ffea00; } 
            100% { color: #b400ff; text-shadow: 0 0 20px #b400ff; }
        }

        #friend-name {
            display: flex;
            gap: clamp(4px, 2vw, 10px);
            margin-top: 10px;
            text-transform: capitalize;
            flex-wrap: wrap;
            justify-content: center;
        }
        .letter {
            font-size: clamp(3rem, 8vw, 5rem);
            font-family: 'Pacifico', cursive;
            color: #ffffff;
            text-shadow: 0 0 15px #ffffff, 2px 5px 5px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
        }
        .wave-anim {
            animation: wave 1.2s infinite alternate ease-in-out;
            opacity: 1 !important;
        }
        @keyframes wave {
            0% { transform: translateY(15px); }
            100% { transform: translateY(-15px); }
        }

        /* --- 5. Responsive CSS 3D Cake --- */
        .cake-wrapper {
            margin-top: 80px;
            margin-bottom: 50px;
            transform: scale(0.8); /* Scale for mobile fit */
        }
        @media(min-width: 768px) {
            .cake-wrapper { transform: scale(1); margin-top: 100px; }
        }
        .cake {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tier { border-radius: 10px 10px 0 0; position: relative; box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);}
        .tier3 { width: 120px; height: 50px; background: #F9A826; z-index: 4; }
        .tier2 { width: 170px; height: 60px; background: #04C2C9; z-index: 3; }
        .tier1 { width: 220px; height: 70px; background: #FF3F8E; z-index: 2; }
        .plate { width: 280px; height: 15px; background: #E0E5EC; border-radius: 20px; z-index: 1; box-shadow: 0 15px 25px rgba(0,0,0,0.7);}
        
        .candles { display: flex; gap: 25px; position: absolute; top: -40px; z-index: 5;}
        .candle { width: 12px; height: 40px; background: repeating-linear-gradient(-45deg, white, white 5px, #ff3366 5px, #ff3366 10px); border-radius: 4px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        .flame {
            width: 16px; height: 26px;
            background: #FFD700;
            border-radius: 50% 50% 20% 20%;
            position: absolute; top: -25px; left: -2px;
            box-shadow: 0 0 20px #FF4500, 0 0 40px #FFD700;
            animation: flicker 0.15s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: scale(0.9) skewX(-2deg); opacity: 0.8; }
            100% { transform: scale(1.1) skewX(2deg); opacity: 1; }
        }

        /* --- 6. Photo Gallery Section (Glassmorphism) --- */
        .gallery-title {
            font-size: 2rem;
            margin-top: 40px;
            margin-bottom: 20px;
            font-family: 'Pacifico', cursive;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-align: center;
        }

        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo-card:hover {
            transform: translateY(-10px);
        }

        /* --- 7. Instagram Premium Button (Fixed at Bottom) --- */
        .insta-btn-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        
        .insta-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 5px 20px rgba(220, 39, 67, 0.6);
            transition: all 0.3s ease;
            animation: floatBtn 3s ease-in-out infinite;
        }
        .insta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.9);
        }
        @keyframes floatBtn {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Tap to Open Surprise! 🎁</button>
    </div>

    <!-- Canvas for Particles -->
    <canvas id="canvas"></canvas>

    <!-- Main Content -->
    <div id="ui-container">
        <div id="happy-birthday">🎉 Happy Birthday 🎉</div>
        <div id="friend-name"></div>

        <!-- Cake Section -->
        <div class="cake-wrapper">
            <div class="cake">
                <div class="candles">
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>
                <div class="tier tier3"></div>
                <div class="tier tier2"></div>
                <div class="tier tier1"></div>
                <div class="plate"></div>
            </div>
        </div>

        <!-- Instagram Photos Gallery -->
        <div class="gallery-title">Memories ✨</div>
        <div class="gallery-container">
            <!-- Photo 1 -->
            <div class="photo-card">
                <iframe src="https://www.instagram.com/p/DLQC910SSDz/embed" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 10px; background: white;"></iframe>
            </div>
            <!-- Photo 2 -->
            <div class="photo-card">
                <iframe src="https://www.instagram.com/p/DNn1KxDs30W/embed" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 10px; background: white;"></iframe>
            </div>
            <!-- Photo 3 -->
            <div class="photo-card">
                <iframe src="https://www.instagram.com/p/DQEvf5YDD0p/embed" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 10px; background: white;"></iframe>
            </div>
            <!-- Photo 4 -->
            <div class="photo-card">
                <iframe src="https://www.instagram.com/p/DVDhnOeDMpu/embed" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 10px; background: white;"></iframe>
            </div>
            <!-- Photo 5 -->
            <div class="photo-card">
                <iframe src="https://www.instagram.com/p/DdBfvqwspFM/embed" width="320" height="400" frameborder="0" scrolling="no" allowtransparency="true" style="border-radius: 10px; background: white;"></iframe>
            </div>
        </div>
    </div>

    <!-- Sticky Instagram Button -->
    <div class="insta-btn-container" id="insta-btn-wrapper" style="display: none;">
        <a href="https://www.instagram.com/aman41764?psln=eDV2M2ZxdGhlMTFx" target="_blank" class="insta-btn">
            📸 Follow Jayant
        </a>
    </div>

    <!-- --- JAVASCRIPT FOR LOGIC & ANIMATION --- -->
    <script>
        // Birthday Boy Name
        const NAME = "Jayant Kumar"; 
        const nameContainer = document.getElementById('friend-name');
        
        // Split name into letters for animation
        for(let i=0; i<NAME.length; i++) {
            let span = document.createElement('span');
            span.className = 'letter';
            span.innerHTML = NAME[i] === ' ' ? '&nbsp;' : NAME[i];
            nameContainer.appendChild(span);
        }

        const letters = document.querySelectorAll('.letter');

        // Start Button Logic
        document.getElementById('start-btn').addEventListener('click', function() {
            let startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            
            setTimeout(() => {
                startScreen.style.display = 'none';
                document.getElementById('ui-container').style.display = 'flex';
                document.getElementById('insta-btn-wrapper').style.display = 'block';
                
                // Play Music
                let music = document.getElementById('bg-music');
                music.volume = 0.4;
                music.play().catch(e => console.log("Music blocked by browser autoplay policy"));

                // Dancing Name Reveal Logic
                let delay = 500;
                letters.forEach((letter, index) => {
                    setTimeout(() => {
                        letter.classList.add('wave-anim');
                        letter.style.animationDelay = `${index * 0.1}s`;
                    }, delay);
                    delay += 100;
                });
            }, 500); // Wait for fade out
        });

        // --- HTML5 CANVAS PARTICLE ENGINE ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let balloons = [];
        const confettiColors = ["#FF3F8E", "#04C2C9", "#2E55C1", "#F9A826", "#00FF00", "#FFD700", "#FFFFFF", "#a200ff"];
        const balloonColors = ["#FF1493", "#00BFFF", "#FFD700", "#32CD32", "#FF4500", "#9400D3", "#ff007f"];

        // Generate Confetti
        for (let i = 0; i < 120; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 4 + 2,
                d: Math.random() * 80, 
                color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                speed: Math.random() * 3 + 1.5,
                angle: Math.random() * 360
            });
        }

        // Generate Balloons
        for (let i = 0; i < 15; i++) {
            balloons.push({
                x: Math.random() * canvas.width,
                y: canvas.height + Math.random() * 800,
                r: Math.random() * 15 + 25, 
                color: balloonColors[Math.floor(Math.random() * balloonColors.length)],
                speed: Math.random() * 1.5 + 0.8,
                sway: Math.random() * 100
            });
        }

        let time = 0;

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            time += 0.02;

            // Draw Confetti
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                p.y += p.speed;
                p.x += Math.sin(time + p.d) * 1.5;

                if (p.y > canvas.height) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }
            }

            // Draw Balloons
            for (let i = 0; i < balloons.length; i++) {
                let b = balloons[i];
                let swayX = b.x + Math.sin(time + b.sway) * 25; 

                // String
                ctx.beginPath();
                ctx.moveTo(swayX, b.y + b.r);
                ctx.quadraticCurveTo(swayX - 10, b.y + b.r + 25, swayX, b.y + b.r + 60);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Body
                ctx.beginPath();
                ctx.arc(swayX, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                
                // Highlight
                ctx.beginPath();
                ctx.arc(swayX - b.r/3, b.y - b.r/3, b.r/4, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
                ctx.fill();

                b.y -= b.speed; 

                if (b.y < -150) {
                    b.y = canvas.height + Math.random() * 300;
                    b.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawCanvas);
        }
        
        drawCanvas();
    </script>
</body>
</html>
